# Regenera os slides a cada mudança em apresentacao/ e publica no GitHub Pages.
name: Publicar slides

on:
  push:
    branches: [main]
    paths: ["apresentacao/**", ".github/workflows/slides.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar os slides
        run: python apresentacao/gerador/build.py
      - name: Montar o site
        run: |
          mkdir -p _site
          cp apresentacao/site/index.html _site/
          cp apresentacao/apresentacao_cobalto.html apresentacao/apresentacao_cobalto.pptx _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
